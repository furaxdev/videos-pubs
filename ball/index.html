<!doctype html><html><head><meta charset="utf-8"><title>BALL MUSIC</title><style>html,body{margin:0;background:#000}canvas{display:block;height:100vh;margin:auto}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// ?dir=exemples/montagem-royal  -> charge <dir>/scene-data.js puis kit + scène
window.ready = new Promise(res => {
  const dir = new URLSearchParams(location.search).get('dir') || 'exemples/montagem-royal';
  const load = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('chargement ' + src)); document.body.appendChild(s); });
  load(dir + '/scene-data.js').then(() => load('../identite/anim/kit.js')).then(() => load('scene.js')).then(() => document.fonts.load('700 46px "Inter Display"')).then(() => document.fonts.load('600 32px Inter')).then(res);
});
</script></body></html>
